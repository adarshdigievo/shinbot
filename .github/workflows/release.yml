name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: Retry publishing an existing release tag whose CI has already passed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'adarshdigievo/shinbot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.2'
          python-version: '3.13.12'
      - name: Validate release identity
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'select(.isDraft == false) | .isPrerelease')
          uv run --no-project python scripts/release.py check --tag "$RELEASE_TAG" --prerelease "$PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Check locked Python dependencies for published advisories
        run: uv run --no-project python scripts/audit_dependencies.py /tmp/shinbot-release-dependencies.json --fail-vulnerable
  checks:
    needs: validate
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_checks
    uses: ./.github/workflows/ci.yml
  site:
    needs: validate
    uses: ./.github/workflows/site-build.yml
    with:
      ref: ${{ github.ref }}
  distributions:
    needs: [validate, checks, site]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' && needs.site.result == 'success' &&
      (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && inputs.skip_checks)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.2'
          python-version: '3.13.12'
      - run: uv build
      - run: uv run --no-project python scripts/release.py check-wheel dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  images:
    needs: [validate, checks, site]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' && needs.site.result == 'success' &&
      (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && inputs.skip_checks)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        service: [control, runtime, computer, browser, desktop, telegram]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: adarshd96/shinbot:${{ needs.validate.outputs.version }}-${{ matrix.service }}
          cache-from: type=registry,ref=adarshd96/shinbot:buildcache-${{ matrix.service }}
          cache-to: type=registry,ref=adarshd96/shinbot:buildcache-${{ matrix.service }},mode=max
          provenance: mode=max
          sbom: true
  pypi:
    name: Publish to PyPI
    needs: [distributions, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/shinbot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
  pages:
    name: Publish website and documentation
    needs: [site, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
  stable-aliases:
    name: Promote latest stable images
    needs: [validate, pypi]
    if: needs.validate.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dockerhub
    concurrency:
      group: docker-stable-aliases
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote only the current latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" != "$RELEASE_TAG" ]; then
            echo 'A different release is latest; leaving stable aliases unchanged.'
            exit 0
          fi
          for service in control runtime computer browser desktop telegram; do
            docker buildx imagetools create \
              --tag "adarshd96/shinbot:latest-$service" \
              "adarshd96/shinbot:$VERSION-$service"
          done
