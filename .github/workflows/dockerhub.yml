name: Docker Hub metadata
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      migrate_caches:
        description: Copy legacy cache tags to shinbot-buildcache and verify every copy
        type: boolean
        default: false
      delete_old_cache_tags:
        description: Remove legacy cache tags only after all copies are verified
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dockerhub-metadata
  cancel-in-progress: false
jobs:
  metadata:
    if: github.repository == 'adarshdigievo/shinbot'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.2'
          python-version: '3.13.12'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: inputs.migrate_caches
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: inputs.migrate_caches
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sync overviews and requested cache maintenance
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MIGRATE_CACHES: ${{ inputs.migrate_caches }}
          DELETE_OLD_CACHE_TAGS: ${{ inputs.delete_old_cache_tags }}
        run: |
          args=()
          if [ "$MIGRATE_CACHES" = true ]; then args+=(--migrate-caches); fi
          if [ "$DELETE_OLD_CACHE_TAGS" = true ]; then args+=(--delete-old-cache-tags); fi
          uv run --no-project python scripts/dockerhub.py "${args[@]}"
