[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "shinbot"
version = "0.1.0a3"
description = "A self-hosted personal assistant powered by Pi Durable"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.0",
  "httpx==0.28.1",
  "croniter==6.2.4",
  "typer>=0.16,<1",
  "websockets==16.1.1",
  "pyyaml==6.0.3",
  "packaging==26.3",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
security = [
  "cisco-ai-skill-scanner==2.3.1",
  "filelock==4.2.1",
  # Newer LiteLLM releases cap filelock below its security fixes.
  "litellm==1.103.9",
]
computer = ["mcp==1.30.0"]
browser = ["playwright>=1.55,<2", "camoufox==0.5.8"]
camoufox = ["camoufox==0.5.8"]

[project.scripts]
shinbot = "shinbot.cli:app"

[project.urls]
Homepage = "https://adarshdigievo.github.io/shinbot/"
Documentation = "https://adarshdigievo.github.io/shinbot/docs/"
Repository = "https://github.com/adarshdigievo/shinbot"
Issues = "https://github.com/adarshdigievo/shinbot/issues"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff>=0.14,<1",
    "playwright>=1.55,<2",
    "pytest-xdist==3.8.0",
]
docs = [
    "great-docs==0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shinbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel.force-include]
"deploy/compose.release.yaml" = "shinbot/deployment/compose.yaml"

[tool.hatch.build.targets.sdist]
include = ["/src", "/deploy", "/browser/package.json", "/browser/package-lock.json", "/computer/package.json", "/computer/package-lock.json", "/runtime/src", "/runtime/package.json", "/runtime/package-lock.json", "/runtime/tsconfig.json", "/runtime/test", "/scripts", "/tests", "/examples", "/marketplaces", "/docs", "/site", "/great-docs.yml", "/.dockerignore", "/README.md", "/LICENSE", "/uv.lock"]
exclude = ["/docs/great-docs"]
