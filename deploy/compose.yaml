name: shinbot
services:
  control:
    image: ${SHINBOT_IMAGE:-adarshidigievo/shinbot}:0.1.0a2-control
    build: {context: .., dockerfile: deploy/Dockerfile, target: control}
    init: true
    restart: unless-stopped
    ports: ["${SHINBOT_BIND:-127.0.0.1}:${SHINBOT_PORT:-8765}:8765"]
    environment:
      SHINBOT_ORIGIN: ${SHINBOT_ORIGIN:-http://localhost:8765}
      SHINBOT_SERVICE_TOKEN: ${SHINBOT_SERVICE_TOKEN:?Run shinbot start to create service credentials}
      SHINBOT_COMPUTER_TOKEN: ${SHINBOT_COMPUTER_TOKEN:?Missing computer credential}
      SHINBOT_BROWSER_TOKEN: ${SHINBOT_BROWSER_TOKEN:?Missing browser credential}
      SHINBOT_CHANNEL_TOKEN: ${SHINBOT_CHANNEL_TOKEN:?Missing channel credential}
      SHINBOT_RUNTIME_URL: http://runtime:8081
      SHINBOT_COMPUTER_URL: http://computer:8082
      SHINBOT_BROWSER_URL: http://browser:8083
      SHINBOT_SAFE_MODE: ${SHINBOT_SAFE_MODE:-0}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
    volumes: ["control-data:/data"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [runtime-net, computer-net, browser-net, channel-net]
  runtime:
    image: ${SHINBOT_IMAGE:-adarshidigievo/shinbot}:0.1.0a2-runtime
    build: {context: .., dockerfile: deploy/Dockerfile, target: runtime}
    init: true
    restart: unless-stopped
    environment:
      SHINBOT_SERVICE_TOKEN: ${SHINBOT_SERVICE_TOKEN}
      SHINBOT_CONTROL_URL: http://control:8765
    volumes: ["runtime-data:/data"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [runtime-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
  computer:
    image: ${SHINBOT_IMAGE:-adarshidigievo/shinbot}:0.1.0a2-computer
    build: {context: .., dockerfile: deploy/Dockerfile, target: computer}
    init: true
    restart: unless-stopped
    environment:
      SHINBOT_EXECUTOR_TOKEN: ${SHINBOT_COMPUTER_TOKEN}
    volumes: ["computer-data:/data", "workspace:/workspace"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    networks: [computer-net]
  browser:
    image: ${SHINBOT_IMAGE:-adarshidigievo/shinbot}:0.1.0a2-browser
    build: {context: .., dockerfile: deploy/Dockerfile, target: browser}
    init: true
    restart: unless-stopped
    environment:
      SHINBOT_EXECUTOR_TOKEN: ${SHINBOT_BROWSER_TOKEN}
    volumes: ["browser-data:/data"]
    shm_size: 1gb
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    networks: [browser-net]
  telegram:
    profiles: [telegram]
    image: ${SHINBOT_IMAGE:-adarshidigievo/shinbot}:0.1.0a2-telegram
    build: {context: .., dockerfile: deploy/Dockerfile, target: telegram}
    init: true
    restart: unless-stopped
    environment:
      SHINBOT_CONTROL_URL: http://control:8765
      SHINBOT_CHANNEL_TOKEN: ${SHINBOT_CHANNEL_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [channel-net]
volumes:
  control-data:
  runtime-data:
  computer-data:
  browser-data:
  workspace:
networks:
  runtime-net:
  computer-net:
  browser-net:
  channel-net:
